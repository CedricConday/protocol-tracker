<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- Protocol Tracker mascot.
       Amber body, ink face. The face is PAINTED, not knocked out: a knockout
       takes the colour of whatever is behind it, which meant a white face on
       the app's cream ground. Ink is the app's own text colour, so the face
       reads as a face on any background and the mark survives being placed on
       something other than cream.
       #rays / #body / #eyes / #mouth are separate so each animates alone. -->
  <rect width="100%" height="100%" fill="#F7F7F2"/>
  <g transform="translate(512.0,512.0)">
    <g id="rays" fill="#E9A23C">
        <path d="M 114.8 -41.8 Q 190.1 -49.6 239.3 -27.3 A 27.3 27.3 0 0 1 239.3 27.3 Q 190.1 49.6 114.8 41.8 Z" transform="rotate(-90.00)"/>
        <path d="M 114.8 -41.8 Q 190.1 -49.6 239.3 -27.3 A 27.3 27.3 0 0 1 239.3 27.3 Q 190.1 49.6 114.8 41.8 Z" transform="rotate(-45.00)"/>
        <path d="M 114.8 -41.8 Q 190.1 -49.6 239.3 -27.3 A 27.3 27.3 0 0 1 239.3 27.3 Q 190.1 49.6 114.8 41.8 Z" transform="rotate(0.00)"/>
        <path d="M 114.8 -41.8 Q 190.1 -49.6 239.3 -27.3 A 27.3 27.3 0 0 1 239.3 27.3 Q 190.1 49.6 114.8 41.8 Z" transform="rotate(45.00)"/>
        <path d="M 114.8 -41.8 Q 190.1 -49.6 239.3 -27.3 A 27.3 27.3 0 0 1 239.3 27.3 Q 190.1 49.6 114.8 41.8 Z" transform="rotate(90.00)"/>
        <path d="M 114.8 -41.8 Q 190.1 -49.6 239.3 -27.3 A 27.3 27.3 0 0 1 239.3 27.3 Q 190.1 49.6 114.8 41.8 Z" transform="rotate(135.00)"/>
        <path d="M 114.8 -41.8 Q 190.1 -49.6 239.3 -27.3 A 27.3 27.3 0 0 1 239.3 27.3 Q 190.1 49.6 114.8 41.8 Z" transform="rotate(180.00)"/>
        <path d="M 114.8 -41.8 Q 190.1 -49.6 239.3 -27.3 A 27.3 27.3 0 0 1 239.3 27.3 Q 190.1 49.6 114.8 41.8 Z" transform="rotate(225.00)"/>
    </g>
    <circle id="body" cx="0" cy="0" r="133.3" fill="#E9A23C"/>
    <g fill="none" stroke="#14213D" stroke-linecap="round">
      <g id="eyes" stroke-width="14.9"><path d="M -70.7 -23.6 Q -47.1 -57.0 -23.6 -23.6"/><path d="M 23.6 -23.6 Q 47.1 -57.0 70.7 -23.6"/></g>
      <g id="mouth" stroke-width="16.1"><path d="M -38.4 28.5 Q 0 71.9 38.4 28.5"/></g>
    </g>
  </g>
</svg>