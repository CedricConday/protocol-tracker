<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- Protocol Tracker mascot. One colour; the face is knocked out of the body
       so whatever is behind it shows through. Groups are kept separate so the
       rays can turn and the eyes can blink without touching the rest. -->
  <defs>
    <mask id="face-a" maskUnits="userSpaceOnUse" x="-1024" y="-1024" width="2048" height="2048">
      <rect x="-1024" y="-1024" width="2048" height="2048" fill="white"/>
      <g id="eyes-a"><ellipse cx="-50.2" cy="-33.0" rx="18.5" ry="22.2" fill="black"/><ellipse cx="50.2" cy="-33.0" rx="18.5" ry="22.2" fill="black"/></g>
      <g id="mouth-a"><path d="M -39.6 31.7 Q 0 73.9 39.6 31.7" fill="none" stroke="black" stroke-width="16.5" stroke-linecap="round"/></g>
    </mask>
  </defs>
  <rect width="100%" height="100%" fill="#F7F7F2"/>
  <g transform="translate(512.0,512.0)">
    <g fill="#E9A23C" mask="url(#face-a)">
      <g id="rays-a">
        <path d="M 119.9 -34.4 Q 214.0 2.6 287.1 26.1 Q 214.0 84.5 119.9 34.4 Z" transform="rotate(-90.00)"/>
        <path d="M 119.9 -34.4 Q 214.0 2.6 287.1 26.1 Q 214.0 84.5 119.9 34.4 Z" transform="rotate(-54.00)"/>
        <path d="M 119.9 -34.4 Q 214.0 2.6 287.1 26.1 Q 214.0 84.5 119.9 34.4 Z" transform="rotate(-18.00)"/>
        <path d="M 119.9 -34.4 Q 214.0 2.6 287.1 26.1 Q 214.0 84.5 119.9 34.4 Z" transform="rotate(18.00)"/>
        <path d="M 119.9 -34.4 Q 214.0 2.6 287.1 26.1 Q 214.0 84.5 119.9 34.4 Z" transform="rotate(54.00)"/>
        <path d="M 119.9 -34.4 Q 214.0 2.6 287.1 26.1 Q 214.0 84.5 119.9 34.4 Z" transform="rotate(90.00)"/>
        <path d="M 119.9 -34.4 Q 214.0 2.6 287.1 26.1 Q 214.0 84.5 119.9 34.4 Z" transform="rotate(126.00)"/>
        <path d="M 119.9 -34.4 Q 214.0 2.6 287.1 26.1 Q 214.0 84.5 119.9 34.4 Z" transform="rotate(162.00)"/>
        <path d="M 119.9 -34.4 Q 214.0 2.6 287.1 26.1 Q 214.0 84.5 119.9 34.4 Z" transform="rotate(198.00)"/>
        <path d="M 119.9 -34.4 Q 214.0 2.6 287.1 26.1 Q 214.0 84.5 119.9 34.4 Z" transform="rotate(234.00)"/>
      </g>
      <circle id="body-a" cx="0" cy="0" r="135.3"/>
    </g>
  </g>
</svg>