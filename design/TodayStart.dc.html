<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,600;12..96,700&family=Hanken+Grotesk:wght@400;500;600;700&display=swap">
  <style>
    body { margin: 0; font-family: 'Hanken Grotesk', system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
    a { color: #C96A50; text-decoration: none; } a:hover { color: #A8503A; }
    * { box-sizing: border-box; }
  </style>
</helmet>

<div style="width: 390px; height: 844px; background: #FAF7F4; display: flex; flex-direction: column; color: #2C2420;">

  <div style="flex-grow: 1; display: flex; flex-direction: column; gap: 22px; padding: 68px 20px 20px;">

    <div style="display: flex; flex-direction: column; gap: 4px;">
      <h1 style="margin: 0; font-family: 'Bricolage Grotesque', system-ui, sans-serif; font-size: 28px; font-weight: 700; letter-spacing: -0.5px; color: #241C18;">Good morning, Cedric</h1>
      <p style="margin: 0; font-size: 15px; color: #7A6A62;">Thursday, 10 September</p>
    </div>

    <div style="display: flex; align-items: center; gap: 14px; background: #F2EDE8; border: 1px solid #E8E0D8; border-radius: 14px; padding: 14px 16px;">
      <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#C4882A" stroke-width="1.7" stroke-linecap="round">
        <circle cx="12" cy="12" r="4.2"></circle>
        <path d="M12 2.4v2.4M12 19.2v2.4M4.2 12H1.8M22.2 12h-2.4M6.5 6.5 4.8 4.8M19.2 19.2l-1.7-1.7M17.5 6.5l1.7-1.7M4.8 19.2l1.7-1.7"></path>
      </svg>
      <div style="flex-grow: 1; display: flex; flex-direction: column; gap: 2px;">
        <span style="font-size: 16px; font-weight: 700;">18° · Clear</span>
        <span style="font-size: 13px; color: #7A6A62;">UV index 4 — 20 min of sun covers today</span>
      </div>
    </div>

    <div style="flex-grow: 1; display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 26px; background: #FBF0ED; border: 1px solid #F0DCD5; border-radius: 22px; padding: 34px 24px;">
      <div style="position: relative; width: 132px; height: 132px; display: flex; align-items: center; justify-content: center;">
        <svg width="132" height="132" viewBox="0 0 132 132" fill="none">
          <circle cx="66" cy="66" r="62" stroke="#F0DCD5" stroke-width="3"></circle>
          <circle cx="66" cy="66" r="62" stroke="#C96A50" stroke-width="3" stroke-linecap="round" stroke-dasharray="10 18"></circle>
        </svg>
        <div style="position: absolute; display: flex; flex-direction: column; align-items: center; gap: 2px;">
          <span style="font-family: 'Bricolage Grotesque', system-ui, sans-serif; font-size: 38px; font-weight: 700; letter-spacing: -1.4px; color: #C96A50;">T=0</span>
          <span style="font-size: 11px; font-weight: 700; letter-spacing: 1.2px; text-transform: uppercase; color: #B08878;">not set</span>
        </div>
      </div>
      <p style="margin: 0; max-width: 250px; font-size: 15px; line-height: 22px; color: #7A6A62; text-align: center; text-wrap: pretty;">Every dose today is scheduled from the moment you tap start. Take your first dose with it.</p>
    </div>

    <button style="height: 62px; border: none; border-radius: 18px; background: #C96A50; color: #FAF7F4; font-family: 'Bricolage Grotesque', system-ui, sans-serif; font-size: 19px; font-weight: 600; letter-spacing: -0.2px; cursor: pointer; box-shadow: 0 8px 20px rgba(168,80,58,0.26);">Start my day</button>

  </div>

  <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); border-top: 1px solid #E8E0D8; background: #FAF7F4; padding: 10px 0 24px;">
    <div style="display: flex; flex-direction: column; align-items: center; gap: 5px; padding: 8px 0;">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#C96A50" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="9"></circle><path d="M12 7v5l3.4 2"></path></svg>
      <span style="font-size: 11px; font-weight: 700; color: #C96A50;">Today</span>
    </div>
    <div style="display: flex; flex-direction: column; align-items: center; gap: 5px; padding: 8px 0;">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#B0A098" stroke-width="1.8" stroke-linecap="round"><rect x="3.5" y="4.5" width="17" height="16" rx="3"></rect><path d="M3.5 9.5h17M8.5 3v3M15.5 3v3"></path></svg>
      <span style="font-size: 11px; font-weight: 600; color: #B0A098;">History</span>
    </div>
    <div style="display: flex; flex-direction: column; align-items: center; gap: 5px; padding: 8px 0;">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#B0A098" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="3.2"></circle><path d="M19.4 14.6a1.7 1.7 0 0 0 .34 1.88l.06.06a2 2 0 1 1-2.84 2.84l-.06-.06a1.7 1.7 0 0 0-1.88-.34 1.7 1.7 0 0 0-1.04 1.56V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.56 1.7 1.7 0 0 0-1.88.34l-.06.06a2 2 0 1 1-2.84-2.84l.06-.06a1.7 1.7 0 0 0 .34-1.88 1.7 1.7 0 0 0-1.56-1.04H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.56-1.1 1.7 1.7 0 0 0-.34-1.88l-.06-.06a2 2 0 1 1 2.84-2.84l.06.06a1.7 1.7 0 0 0 1.88.34H9a1.7 1.7 0 0 0 1-1.56V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1.04 1.56 1.7 1.7 0 0 0 1.88-.34l.06-.06a2 2 0 1 1 2.84 2.84l-.06.06a1.7 1.7 0 0 0-.34 1.88V9a1.7 1.7 0 0 0 1.56 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1.04z"></path></svg>
      <span style="font-size: 11px; font-weight: 600; color: #B0A098;">Settings</span>
    </div>
  </div>

</div>
</x-dc>
<script data-dc-script data-props='{}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
