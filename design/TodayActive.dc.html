<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,600;12..96,700&family=Hanken+Grotesk:wght@400;500;600;700&display=swap">
  <style>
    body { margin: 0; font-family: 'Hanken Grotesk', system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
    a { color: #C96A50; text-decoration: none; } a:hover { color: #A8503A; }
    * { box-sizing: border-box; }
  </style>
</helmet>

<div style="width: 390px; height: 844px; background: #FAF7F4; display: flex; flex-direction: column; color: #2C2420;">

  <div style="flex-grow: 1; overflow: hidden; display: flex; flex-direction: column; gap: 18px; padding: 62px 20px 12px;">

    <div style="display: flex; align-items: flex-start; justify-content: space-between; gap: 12px;">
      <div style="display: flex; flex-direction: column; gap: 3px;">
        <h1 style="margin: 0; font-family: 'Bricolage Grotesque', system-ui, sans-serif; font-size: 26px; font-weight: 700; letter-spacing: -0.5px; color: #241C18;">Today</h1>
        <span style="font-size: 13px; color: #7A6A62;">Thursday, 10 September</span>
      </div>
      <div style="display: flex; flex-direction: column; align-items: flex-end; gap: 2px; background: #FBF0ED; border: 1px solid #F0DCD5; border-radius: 12px; padding: 8px 12px;">
        <span style="font-size: 10px; font-weight: 700; letter-spacing: 1.1px; text-transform: uppercase; color: #B08878;">T=0 anchor</span>
        <span style="font-family: 'Bricolage Grotesque', system-ui, sans-serif; font-size: 17px; font-weight: 700; letter-spacing: -0.3px; color: #C96A50;">07:40</span>
      </div>
    </div>

    <div style="display: flex; flex-direction: column; gap: 9px; background: #F2EDE8; border: 1px solid #E8E0D8; border-radius: 14px; padding: 15px 16px;">
      <div style="display: flex; align-items: baseline; justify-content: space-between;">
        <span style="font-size: 15px; font-weight: 700;">2 of 5 doses</span>
        <span style="font-size: 13px; color: #7A6A62;">next in 42 min</span>
      </div>
      <div style="height: 8px; border-radius: 4px; background: #E8E0D8; overflow: hidden;">
        <div style="width: 40%; height: 100%; border-radius: 4px; background: #C96A50;"></div>
      </div>
    </div>

    <div style="display: flex; flex-direction: column; gap: 8px;">
      <span style="font-size: 11px; font-weight: 700; letter-spacing: 1.2px; text-transform: uppercase; color: #7A6A62;">Doses</span>

      <sc-for list="{{doses}}" as="dose" hint-placeholder-count="3">
        <div style="position: relative; display: flex; align-items: center; border-radius: 12px; padding: 16px 14px; overflow: hidden; background: {{dose.bg}};">
          <div style="position: absolute; left: 0; top: 0; bottom: 0; width: 3px; border-radius: 3px; background: {{dose.accent}};"></div>
          <div style="width: 64px; display: flex; flex-direction: column; align-items: center; padding-left: 8px;">
            <span style="font-size: 14px; font-weight: 600; color: {{dose.timeColor}};">{{dose.time}}</span>
            <span style="font-size: 11px; margin-top: 1px; color: {{dose.timeColor}};">{{dose.ampm}}</span>
          </div>
          <div style="width: 1px; height: 36px; background: #D8CFC8; margin: 0 12px;"></div>
          <div style="flex-grow: 1; display: flex; flex-direction: column; gap: 2px;">
            <span style="font-size: 15px; font-weight: 600; color: #2C2420;">{{dose.name}}</span>
            <span style="font-size: 13px; color: #7A6A62;">{{dose.meta}}</span>
          </div>
          <span style="font-size: 12px; font-weight: 700; letter-spacing: 0.6px; color: {{dose.accent}};">{{dose.mark}}</span>
        </div>
      </sc-for>
    </div>

    <div style="display: flex; flex-direction: column; gap: 13px; background: #F2EDE8; border: 1px solid #E8E0D8; border-radius: 14px; padding: 16px;">
      <div style="display: flex; align-items: center; justify-content: space-between;">
        <div style="display: flex; align-items: center; gap: 8px;">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#4A7A9B" stroke-width="1.8" stroke-linejoin="round"><path d="M12 3.2s6.2 6.4 6.2 10.4a6.2 6.2 0 0 1-12.4 0C5.8 9.6 12 3.2 12 3.2z"></path></svg>
          <span style="font-size: 14px; font-weight: 600; color: #7A6A62;">Water</span>
        </div>
        <span style="font-size: 16px; font-weight: 700;">1.5L <span style="font-size: 14px; font-weight: 400; color: #B0A098;">/ 2.5L</span></span>
      </div>

      <div style="display: flex; gap: 4px;">
        <div style="flex-grow: 1; height: 10px; border-radius: 5px; background: #4A7A9B;"></div>
        <div style="flex-grow: 1; height: 10px; border-radius: 5px; background: #4A7A9B;"></div>
        <div style="flex-grow: 1; height: 10px; border-radius: 5px; background: #4A7A9B;"></div>
        <div style="flex-grow: 1; height: 10px; border-radius: 5px; background: #E8E0D8;"></div>
        <div style="flex-grow: 1; height: 10px; border-radius: 5px; background: #E8E0D8;"></div>
      </div>

      <div style="display: flex; align-items: center; gap: 10px;">
        <button style="width: 46px; height: 46px; flex-shrink: 0; border: 1px solid #D8CFC8; border-radius: 12px; background: #FAF7F4; cursor: pointer; display: flex; align-items: center; justify-content: center;">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#7A6A62" stroke-width="2.2" stroke-linecap="round"><path d="M5 12h14"></path></svg>
        </button>
        <div style="flex-grow: 1; height: 46px; display: flex; align-items: center; justify-content: center; gap: 4px; border: 1px solid #D8CFC8; border-radius: 12px; background: #FAF7F4;">
          <input value="250" style="width: 58px; border: none; background: transparent; text-align: right; font-family: 'Bricolage Grotesque', system-ui, sans-serif; font-size: 19px; font-weight: 700; color: #2C2420;">
          <span style="font-size: 14px; font-weight: 600; color: #B0A098;">ml</span>
        </div>
        <button style="width: 46px; height: 46px; flex-shrink: 0; border: 1px solid #D8CFC8; border-radius: 12px; background: #FAF7F4; cursor: pointer; display: flex; align-items: center; justify-content: center;">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#7A6A62" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"></path></svg>
        </button>
      </div>

      <div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 7px;">
        <button style="height: 44px; border: 1px solid #D8CFC8; border-radius: 11px; background: #FAF7F4; font-family: inherit; font-size: 13px; font-weight: 600; color: #7A6A62; cursor: pointer;">150</button>
        <button style="height: 44px; border: 1px solid #4A7A9B; border-radius: 11px; background: #EBF0F5; font-family: inherit; font-size: 13px; font-weight: 700; color: #4A7A9B; cursor: pointer;">250</button>
        <button style="height: 44px; border: 1px solid #D8CFC8; border-radius: 11px; background: #FAF7F4; font-family: inherit; font-size: 13px; font-weight: 600; color: #7A6A62; cursor: pointer;">500</button>
        <button style="height: 44px; border: 1px solid #D8CFC8; border-radius: 11px; background: #FAF7F4; font-family: inherit; font-size: 13px; font-weight: 600; color: #7A6A62; cursor: pointer;">750</button>
      </div>

      <button style="height: 48px; border: none; border-radius: 12px; background: #4A7A9B; color: #FAF7F4; font-family: inherit; font-size: 15px; font-weight: 700; cursor: pointer;">Log 250 ml</button>
    </div>

  </div>

  <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); border-top: 1px solid #E8E0D8; background: #FAF7F4; padding: 10px 0 24px;">
    <div style="display: flex; flex-direction: column; align-items: center; gap: 5px; padding: 8px 0;">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#C96A50" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="9"></circle><path d="M12 7v5l3.4 2"></path></svg>
      <span style="font-size: 11px; font-weight: 700; color: #C96A50;">Today</span>
    </div>
    <div style="display: flex; flex-direction: column; align-items: center; gap: 5px; padding: 8px 0;">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#B0A098" stroke-width="1.8" stroke-linecap="round"><rect x="3.5" y="4.5" width="17" height="16" rx="3"></rect><path d="M3.5 9.5h17M8.5 3v3M15.5 3v3"></path></svg>
      <span style="font-size: 11px; font-weight: 600; color: #B0A098;">History</span>
    </div>
    <div style="display: flex; flex-direction: column; align-items: center; gap: 5px; padding: 8px 0;">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#B0A098" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="3.2"></circle><path d="M19.4 14.6a1.7 1.7 0 0 0 .34 1.88l.06.06a2 2 0 1 1-2.84 2.84l-.06-.06a1.7 1.7 0 0 0-1.88-.34 1.7 1.7 0 0 0-1.04 1.56V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.56 1.7 1.7 0 0 0-1.88.34l-.06.06a2 2 0 1 1-2.84-2.84l.06-.06a1.7 1.7 0 0 0 .34-1.88 1.7 1.7 0 0 0-1.56-1.04H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.56-1.1 1.7 1.7 0 0 0-.34-1.88l-.06-.06a2 2 0 1 1 2.84-2.84l.06.06a1.7 1.7 0 0 0 1.88.34H9a1.7 1.7 0 0 0 1-1.56V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1.04 1.56 1.7 1.7 0 0 0 1.88-.34l.06-.06a2 2 0 1 1 2.84 2.84l-.06.06a1.7 1.7 0 0 0-.34 1.88V9a1.7 1.7 0 0 0 1.56 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1.04z"></path></svg>
      <span style="font-size: 11px; font-weight: 600; color: #B0A098;">Settings</span>
    </div>
  </div>

</div>
</x-dc>
<script data-dc-script data-props='{}'>
class Component extends DCLogic {
  renderVals() {
    return {
      doses: [
        { time: '7:40',  ampm: 'AM', name: 'Vitamin D3',      meta: '60,000 IU · capsule', bg: '#F2EDE8', accent: '#5A8A5A', timeColor: '#B0A098', mark: 'TAKEN' },
        { time: '8:10',  ampm: 'AM', name: 'Vitamin K2 (MK7)', meta: '400 mcg · with food', bg: '#F2EDE8', accent: '#5A8A5A', timeColor: '#B0A098', mark: 'TAKEN' },
        { time: '12:40', ampm: 'PM', name: 'Magnesium citrate', meta: '400 mg · capsule',   bg: '#FBF0ED', accent: '#C96A50', timeColor: '#C96A50', mark: 'NOW' },
        { time: '4:40',  ampm: 'PM', name: 'Riboflavin B2',    meta: '400 mg · tablet',     bg: '#F2EDE8', accent: '#4A7A9B', timeColor: '#7A6A62', mark: '' },
      ],
    };
  }
}
</script>
</body>
</html>
