<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,600;12..96,700&family=Hanken+Grotesk:wght@400;500;600;700&display=swap">
  <style>
    body { margin: 0; font-family: 'Hanken Grotesk', system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
    a { color: #C96A50; text-decoration: none; } a:hover { color: #A8503A; }
    * { box-sizing: border-box; }
  </style>
</helmet>

<div style="width: 390px; height: 844px; background: #FAF7F4; display: flex; flex-direction: column; color: #2C2420;">

  <div style="flex-grow: 1; overflow: hidden; display: flex; flex-direction: column; gap: 22px; padding: 62px 20px 12px;">

    <h1 style="margin: 0; font-family: 'Bricolage Grotesque', system-ui, sans-serif; font-size: 26px; font-weight: 700; letter-spacing: -0.5px; color: #241C18;">Settings</h1>

    <div style="display: flex; align-items: center; gap: 14px; background: #F2EDE8; border: 1px solid #E8E0D8; border-radius: 16px; padding: 16px;">
      <div style="width: 48px; height: 48px; flex-shrink: 0; border-radius: 16px; background: #C96A50; display: flex; align-items: center; justify-content: center; font-family: 'Bricolage Grotesque', system-ui, sans-serif; font-size: 20px; font-weight: 700; color: #FAF7F4;">C</div>
      <div style="flex-grow: 1; display: flex; flex-direction: column; gap: 2px;">
        <span style="font-size: 16px; font-weight: 700;">Cedric</span>
        <span style="font-size: 13px; color: #7A6A62;">80 kg · 60,000 IU daily</span>
      </div>
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#B0A098" stroke-width="2" stroke-linecap="round"><path d="M9 5l7 7-7 7"></path></svg>
    </div>

    <div style="display: flex; flex-direction: column; gap: 9px;">
      <span style="font-size: 11px; font-weight: 700; letter-spacing: 1.2px; text-transform: uppercase; color: #7A6A62;">Protocol</span>

      <div style="display: flex; align-items: center; gap: 14px; background: #F2EDE8; border: 1px solid #E8E0D8; border-radius: 14px; padding: 15px 16px;">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#C96A50" stroke-width="1.8" stroke-linecap="round"><rect x="2.8" y="9.2" width="18.4" height="8.6" rx="4.3" transform="rotate(-45 12 12)"></rect><path d="M8.6 8.6l6.8 6.8"></path></svg>
        <div style="flex-grow: 1; display: flex; flex-direction: column; gap: 2px;">
          <span style="font-size: 15px; font-weight: 600;">Supplements</span>
          <span style="font-size: 13px; color: #7A6A62;">5 in your protocol</span>
        </div>
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#B0A098" stroke-width="2" stroke-linecap="round"><path d="M9 5l7 7-7 7"></path></svg>
      </div>

      <div style="display: flex; align-items: center; gap: 14px; background: #F2EDE8; border: 1px solid #E8E0D8; border-radius: 14px; padding: 15px 16px;">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#C96A50" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="9"></circle><path d="M12 7v5l3.4 2"></path></svg>
        <div style="flex-grow: 1; display: flex; flex-direction: column; gap: 2px;">
          <span style="font-size: 15px; font-weight: 600;">Offsets from T=0</span>
          <span style="font-size: 13px; color: #7A6A62;">0, 30, 300, 540 min</span>
        </div>
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#B0A098" stroke-width="2" stroke-linecap="round"><path d="M9 5l7 7-7 7"></path></svg>
      </div>

      <div style="display: flex; align-items: center; gap: 14px; background: #F2EDE8; border: 1px solid #E8E0D8; border-radius: 14px; padding: 15px 16px;">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#4A7A9B" stroke-width="1.8" stroke-linejoin="round"><path d="M12 3.2s6.2 6.4 6.2 10.4a6.2 6.2 0 0 1-12.4 0C5.8 9.6 12 3.2 12 3.2z"></path></svg>
        <div style="flex-grow: 1; display: flex; flex-direction: column; gap: 2px;">
          <span style="font-size: 15px; font-weight: 600;">Water goal</span>
          <span style="font-size: 13px; color: #7A6A62;">2.5 L per day</span>
        </div>
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#B0A098" stroke-width="2" stroke-linecap="round"><path d="M9 5l7 7-7 7"></path></svg>
      </div>
    </div>

    <div style="display: flex; flex-direction: column; gap: 9px;">
      <span style="font-size: 11px; font-weight: 700; letter-spacing: 1.2px; text-transform: uppercase; color: #7A6A62;">Reminders</span>

      <div style="display: flex; align-items: center; gap: 14px; background: #F2EDE8; border: 1px solid #E8E0D8; border-radius: 14px; padding: 15px 16px;">
        <div style="flex-grow: 1; display: flex; flex-direction: column; gap: 2px;">
          <span style="font-size: 15px; font-weight: 600;">Dose reminders</span>
          <span style="font-size: 13px; color: #7A6A62;">A nudge at each offset</span>
        </div>
        <div style="width: 52px; height: 31px; flex-shrink: 0; border-radius: 16px; background: #C96A50; display: flex; align-items: center; justify-content: flex-end; padding: 3px;">
          <div style="width: 25px; height: 25px; border-radius: 13px; background: #FAF7F4;"></div>
        </div>
      </div>

      <div style="display: flex; align-items: center; gap: 14px; background: #F2EDE8; border: 1px solid #E8E0D8; border-radius: 14px; padding: 15px 16px;">
        <div style="flex-grow: 1; display: flex; flex-direction: column; gap: 2px;">
          <span style="font-size: 15px; font-weight: 600;">Water reminders</span>
          <span style="font-size: 13px; color: #7A6A62;">Every 90 minutes</span>
        </div>
        <div style="width: 52px; height: 31px; flex-shrink: 0; border-radius: 16px; background: #E8E0D8; display: flex; align-items: center; justify-content: flex-start; padding: 3px;">
          <div style="width: 25px; height: 25px; border-radius: 13px; background: #FAF7F4;"></div>
        </div>
      </div>
    </div>

    <button style="height: 50px; margin-top: 4px; border: 1px solid #D8CFC8; border-radius: 14px; background: transparent; font-family: inherit; font-size: 15px; font-weight: 600; color: #C04040; cursor: pointer;">Sign out</button>

  </div>

  <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); border-top: 1px solid #E8E0D8; background: #FAF7F4; padding: 10px 0 24px;">
    <div style="display: flex; flex-direction: column; align-items: center; gap: 5px; padding: 8px 0;">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#B0A098" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="9"></circle><path d="M12 7v5l3.4 2"></path></svg>
      <span style="font-size: 11px; font-weight: 600; color: #B0A098;">Today</span>
    </div>
    <div style="display: flex; flex-direction: column; align-items: center; gap: 5px; padding: 8px 0;">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#B0A098" stroke-width="1.8" stroke-linecap="round"><rect x="3.5" y="4.5" width="17" height="16" rx="3"></rect><path d="M3.5 9.5h17M8.5 3v3M15.5 3v3"></path></svg>
      <span style="font-size: 11px; font-weight: 600; color: #B0A098;">History</span>
    </div>
    <div style="display: flex; flex-direction: column; align-items: center; gap: 5px; padding: 8px 0;">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#C96A50" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="3.2"></circle><path d="M19.4 14.6a1.7 1.7 0 0 0 .34 1.88l.06.06a2 2 0 1 1-2.84 2.84l-.06-.06a1.7 1.7 0 0 0-1.88-.34 1.7 1.7 0 0 0-1.04 1.56V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.56 1.7 1.7 0 0 0-1.88.34l-.06.06a2 2 0 1 1-2.84-2.84l.06-.06a1.7 1.7 0 0 0 .34-1.88 1.7 1.7 0 0 0-1.56-1.04H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.56-1.1 1.7 1.7 0 0 0-.34-1.88l-.06-.06a2 2 0 1 1 2.84-2.84l.06.06a1.7 1.7 0 0 0 1.88.34H9a1.7 1.7 0 0 0 1-1.56V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1.04 1.56 1.7 1.7 0 0 0 1.88-.34l.06-.06a2 2 0 1 1 2.84 2.84l-.06.06a1.7 1.7 0 0 0-.34 1.88V9a1.7 1.7 0 0 0 1.56 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1.04z"></path></svg>
      <span style="font-size: 11px; font-weight: 700; color: #C96A50;">Settings</span>
    </div>
  </div>

</div>
</x-dc>
<script data-dc-script data-props='{}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
