<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,600;12..96,700&family=Hanken+Grotesk:wght@400;500;600;700&display=swap">
  <style>
    body { margin: 0; font-family: 'Hanken Grotesk', system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
    a { color: #C96A50; text-decoration: none; } a:hover { color: #A8503A; }
    * { box-sizing: border-box; }
  </style>
</helmet>

<div style="width: 390px; height: 844px; background: #FAF7F4; display: flex; flex-direction: column; justify-content: space-between; padding: 92px 28px 40px; color: #2C2420;">

  <div style="display: flex; flex-direction: column; align-items: center; gap: 28px;">
    <div style="width: 76px; height: 76px; border-radius: 22px; background: #C96A50; display: flex; align-items: center; justify-content: center; box-shadow: 0 12px 28px rgba(168,80,58,0.22);">
      <svg width="40" height="40" viewBox="0 0 40 40" fill="none" stroke="#FAF7F4" stroke-width="2.6" stroke-linecap="round">
        <circle cx="20" cy="20" r="14"></circle>
        <path d="M20 11 V20 L27 24"></path>
        <circle cx="20" cy="20" r="2.6" fill="#FAF7F4" stroke="none"></circle>
      </svg>
    </div>
    <div style="display: flex; flex-direction: column; align-items: center; gap: 8px;">
      <h1 style="margin: 0; font-family: 'Bricolage Grotesque', system-ui, sans-serif; font-size: 30px; font-weight: 700; letter-spacing: -0.6px; color: #241C18;">Protocol Tracker</h1>
      <p style="margin: 0; font-size: 15px; line-height: 22px; color: #7A6A62; text-align: center; text-wrap: pretty;">Your day starts when you say it does.</p>
    </div>
  </div>

  <div style="display: flex; flex-direction: column; gap: 12px;">
    <label style="display: flex; flex-direction: column; gap: 7px;">
      <span style="font-size: 11px; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; color: #7A6A62;">Email</span>
      <input type="email" value="cedric@example.com" style="height: 52px; border-radius: 12px; border: 1px solid #D8CFC8; background: #F2EDE8; padding: 0 16px; font-family: inherit; font-size: 16px; font-weight: 500; color: #2C2420;">
    </label>
    <label style="display: flex; flex-direction: column; gap: 7px;">
      <span style="font-size: 11px; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; color: #7A6A62;">Password</span>
      <input type="password" value="passphrase" style="height: 52px; border-radius: 12px; border: 1px solid #D8CFC8; background: #F2EDE8; padding: 0 16px; font-family: inherit; font-size: 16px; font-weight: 500; color: #2C2420;">
    </label>
    <a href="#" style="align-self: flex-end; font-size: 13px; font-weight: 600; padding: 6px 2px;">Forgot password</a>
  </div>

  <div style="display: flex; flex-direction: column; gap: 14px;">
    <button style="height: 56px; border: none; border-radius: 16px; background: #C96A50; color: #FAF7F4; font-family: 'Bricolage Grotesque', system-ui, sans-serif; font-size: 17px; font-weight: 600; letter-spacing: -0.2px; cursor: pointer; box-shadow: 0 6px 16px rgba(168,80,58,0.24);">Sign in</button>
    <button style="height: 52px; border: 1px solid #D8CFC8; border-radius: 16px; background: transparent; color: #2C2420; font-family: inherit; font-size: 15px; font-weight: 600; cursor: pointer;">Create an account</button>
    <button style="height: 44px; border: none; background: transparent; color: #7A6A62; font-family: inherit; font-size: 14px; font-weight: 600; cursor: pointer;">Continue on this device only</button>
    <p style="margin: 4px 0 0; font-size: 12px; line-height: 18px; color: #B0A098; text-align: center; text-wrap: pretty;">Your protocol data stays on your device. An account only syncs it between your own devices.</p>
  </div>

</div>
</x-dc>
<script data-dc-script data-props='{}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
