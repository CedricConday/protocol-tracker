# Build a sideloadable Android APK on GitHub's x86-64 runners.
#
# Why this exists: the VPS is aarch64 and the Android NDK toolchain is x86-64,
# so `gradlew` cannot run there at all. EAS can build it but the free tier
# queued ~67 min on 2026-09-15 before it even started. A runner here picks the
# job up in seconds. (The "~15-25 min" this line used to claim was never
# measured — see below.)
#
# The APK is signed with the debug keystore that `expo prebuild` wires into the
# release config — fine for sideloading and internal testing, NOT for Play.
#
# MANUAL ONLY, and disabled in the Actions tab as of 2026-09-17.
#
# It used to run on every push to master touching src/**. It never once
# produced an APK: `assembleRelease` exhausts the JVM Metaspace that Expo's
# default gradle.properties gives it (512m), and with --no-daemon it thrashes
# instead of failing, so every run died on the 90-minute timeout. That was 17
# runs and ~1,500 billed minutes on 2026-09-17 alone, for nothing, on a private
# repo.
#
# Before running this again, raise the heap first — after the prebuild step:
#   echo 'org.gradle.jvmargs=-Xmx6g -XX:MaxMetaspaceSize=2g' >> android/gradle.properties
# The runner has 16 GB. Without that line this job cannot finish.
#
# The phone is fed by ota-update, not by this. An APK is only needed to
# sideload a new native build.
name: android-apk

on:
  workflow_dispatch:

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    # 45, not 90: if it has not linked by then it is stuck, and a stuck run
    # should cost half an hour, not an hour and a half.
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      # Node 22 matches the EAS builder image, so the lockfile is resolved by
      # the same npm major that validated it (npm 10.x, not this box's npm 12).
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Install NDK 27.1.12297006
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'ndk;27.1.12297006' 'cmake;3.22.1'

      - name: Install dependencies
        run: npm ci --include=dev

      - name: Prebuild android project
        run: npx expo prebuild --platform android --no-install

      # arm64-v8a only. The default builds four ABIs (armeabi-v7a, arm64-v8a,
      # x86, x86_64) and the native compile dominates the run — on a 2-core
      # runner that overran a 45 min budget on 2026-09-15. Every phone made in
      # the last decade is arm64; add ABIs back only for emulators.
      - name: Assemble release APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a

      - name: Name the artifact
        id: name
        run: echo "tag=$(date +%Y%m%d-%H%M)-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: protocol-tracker-${{ steps.name.outputs.tag }}
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 14
