# Publish an over-the-air update to the installed app on every push to master.
#
# Why this exists: on 2026-09-17 ten commits sat in git for a day while the
# phone kept reporting "You're up to date" — truthfully, because the in-app
# check asks the update channel and nothing had published to it since the
# previous morning. Git, GitHub, the OTA channel and the binary are four
# artifacts; a push moved the first two and nothing moved the third.
#
# The channel must match the channel of the build that is installed. The only
# binary that has ever existed is the `preview` profile (eas.json), so that is
# where field installs look. Publishing to `production` would report success
# and change nothing on any device.
#
# JS/TS-only work ships this way. A native module, an SDK bump or a change to
# app.json's native config still needs a new APK — android-apk.yml.
name: ota-update

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - 'src/**'
      - 'assets/**'
      - 'app.json'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/ota-update.yml'

# One publish at a time, and never cancel one that is running: a cancelled
# upload can leave the channel pointing at a half-written group. Later pushes
# queue behind the current one instead.
concurrency:
  group: ota-update
  cancel-in-progress: false

jobs:
  # The gates run as their own job so a red typecheck or a failing test stops
  # the publish. Shipping straight to a phone is exactly where an unchecked
  # push costs the most — the 2026-09-15 launch went out broken.
  gates:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --include=dev
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Unit tests
        run: npx vitest run

  publish:
    needs: gates
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      # Fail loudly rather than skip. A missing token that merely skips the job
      # reads as a green run and puts us back where we started: master ahead of
      # the phone with nothing saying so.
      - name: Require EXPO_TOKEN
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "::error::EXPO_TOKEN is not set. Create a token at" \
                 "https://expo.dev/settings/access-tokens and add it with:" \
                 "gh secret set EXPO_TOKEN --repo CedricConday/protocol-tracker"
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci --include=dev

      # --environment is mandatory in non-interactive mode (eas-cli 24.x) and
      # is a separate axis from --branch; without it the command exits before
      # publishing anything.
      - name: Publish OTA update
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          MSG="$(git log -1 --pretty=%s | cut -c1-180)"
          npx eas-cli@latest update \
            --branch preview \
            --environment preview \
            --message "$MSG" \
            --non-interactive
